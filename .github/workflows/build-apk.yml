name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Tailwind CSS oxide
        run: npm rebuild @tailwindcss/oxide

      - name: Build web app
        run: npm run build

      - name: Ensure @capacitor/android is installed
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          npm ls @capacitor/android >/dev/null 2>&1 || npm install @capacitor/android@$CAP_VERSION --no-save

      - name: Add Android platform if missing
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agro-save-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
